name: RKT quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: racket_mvp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d racket_mvp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:123456@localhost:5432/racket_mvp_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma db push --skip-generate
      - run: pnpm typecheck
      - run: node scripts/check-no-skipped-tests.mjs
      - run: pnpm test:strict
      - run: pnpm test:coverage
